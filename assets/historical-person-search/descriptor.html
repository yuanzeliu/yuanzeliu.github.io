<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="Inspect one source-language person descriptor across all occurrences in the Twenty-Five Histories.">
  <title>Historical Descriptor Explorer</title>
  <style>
    :root{--bg:#f4f6f8;--surface:#fff;--text:#182235;--muted:#687587;--line:#dbe2e9;--accent:#235f78;--soft:#eaf4f6;--warn:#8b5e16;--warnbg:#fff5db;--tag:#eef2f5;--bar:#4c91aa}
    @media(prefers-color-scheme:dark){:root{--bg:#10171f;--surface:#17212b;--text:#eef3f7;--muted:#aab6c3;--line:#354351;--accent:#79c6df;--soft:#173441;--warn:#ffd27a;--warnbg:#3b3019;--tag:#263440;--bar:#79c6df}}
    *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang TC","Noto Sans CJK TC",sans-serif}a{color:var(--accent)}main{max-width:1240px;margin:auto;padding:30px 22px 80px}.topline{display:flex;justify-content:space-between;align-items:center;gap:20px}.back{font-size:14px}.language-switch{display:flex;gap:5px;background:var(--surface);border:1px solid var(--line);border-radius:11px;padding:4px}.language-switch button{border:0;padding:7px 10px}.language-switch button[aria-pressed="true"]{background:var(--accent);color:var(--surface)}h1{font-size:clamp(32px,6vw,54px);line-height:1.05;margin:22px 0 10px}.lead{color:var(--muted);font-size:16px;line-height:1.65;max-width:900px}.search-panel,.panel,.occurrence{background:var(--surface);border:1px solid var(--line);border-radius:15px}.search-panel{padding:16px;margin:22px 0}.search-row{display:grid;grid-template-columns:minmax(240px,1fr) auto;gap:10px}.search-row input{width:100%;font:inherit;font-size:19px;padding:13px 15px;border:2px solid var(--line);border-radius:11px;background:var(--surface);color:var(--text)}button,select{font:inherit;background:var(--surface);color:var(--text);border:1px solid var(--line);border-radius:9px;padding:9px 12px;cursor:pointer}button.primary{background:var(--accent);color:var(--surface);border-color:var(--accent);font-weight:650;padding-inline:24px}.status{color:var(--muted);font-size:14px;margin:12px 2px}.descriptor-title{font-family:"Noto Serif CJK TC","Songti TC",serif}.metrics{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:9px;margin:15px 0}.metric{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px}.metric strong{display:block;font-size:24px}.metric span{font-size:12px;color:var(--muted)}.grid{display:grid;grid-template-columns:1fr 1fr;gap:13px}.panel{padding:16px;margin-top:13px}.panel h2{font-size:18px;margin:0 0 12px}.tags{display:flex;flex-wrap:wrap;gap:6px}.tag{display:inline-block;background:var(--tag);border-radius:999px;padding:5px 9px;font-size:12px}.more-items[hidden]{display:none}.more-button{border:0;color:var(--accent);font-weight:650;background:transparent}.band{display:grid;grid-template-columns:70px 1fr 52px;align-items:center;gap:8px;margin:8px 0;font-size:13px}.bar-track{height:11px;background:var(--tag);border-radius:8px;overflow:hidden}.bar{height:100%;background:var(--bar);border-radius:8px}.filters{display:flex;gap:9px;flex-wrap:wrap;align-items:center}.filters label{display:flex;align-items:center;gap:6px;color:var(--muted);font-size:13px}.filters input{font:inherit;background:var(--surface);color:var(--text);border:1px solid var(--line);border-radius:9px;padding:8px 10px;min-width:220px}.context-head{display:flex;justify-content:space-between;align-items:flex-start;gap:15px;margin-bottom:8px}.context-head h2{margin:0}.context-count{color:var(--muted);font-size:13px}.occurrence{padding:14px 16px;margin-top:10px}.occurrence-top{display:flex;justify-content:space-between;gap:14px}.person-name{font-weight:750}.meta{color:var(--muted);font-size:12px;line-height:1.55}.score{font-size:20px;font-weight:750;white-space:nowrap}.source-text{font-family:"Noto Serif CJK TC","Songti TC",serif;font-size:16px;line-height:1.85;margin-top:8px}.meaning{color:var(--muted);font-size:13px;margin-top:7px}.candidate-label{display:inline-block;color:var(--warn);background:var(--warnbg);border-radius:999px;padding:3px 7px;font-size:11px;margin:7px 0 1px}.warning{border-left:4px solid var(--warn);background:var(--warnbg);padding:9px 12px;margin:9px 0;border-radius:5px;font-size:13px;color:var(--warn)}mark{background:#ffe895;color:#231f10;padding:0 1px;border-radius:2px}.empty{background:var(--surface);border:1px dashed var(--line);border-radius:15px;padding:38px;text-align:center;color:var(--muted)}.source-note{color:var(--muted);font-size:12px;line-height:1.5;margin:20px 2px 0}
    @media(max-width:880px){.metrics{grid-template-columns:repeat(3,1fr)}.grid{grid-template-columns:1fr}.context-head,.topline{align-items:flex-start}.context-head{display:block}.filters{margin-top:12px}}
    @media(max-width:560px){main{padding-inline:14px}.search-row{grid-template-columns:1fr}.metrics{grid-template-columns:repeat(2,1fr)}.occurrence-top{display:block}.score{margin-top:5px}}
  </style>
</head>
<body>
<main>
  <div class="topline">
    <a class="back" id="back-link" href="index.html"></a>
    <div class="language-switch" role="group" aria-label="Language">
      <button type="button" id="lang-en" data-lang="en">English</button>
      <button type="button" id="lang-zh" data-lang="zh">繁體中文</button>
    </div>
  </div>
  <h1 id="page-title"></h1>
  <p class="lead" id="page-lead"></p>
  <div class="search-panel">
    <div class="search-row"><input id="query" type="search" autocomplete="off"><button class="primary" id="search" type="button"></button></div>
  </div>
  <div id="status" class="status" aria-live="polite"></div>
  <div id="content"></div>
  <p id="source-note" class="source-note"></p>
</main>
<script>
(()=>{
  'use strict';
  const API_BASE=/^(localhost|127\.0\.0\.1)$/.test(location.hostname)?'http://127.0.0.1:8765':'https://societyinmind.net/historical-trait';
  const $=id=>document.getElementById(id);
  const esc=value=>String(value??'').replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
  const queryEl=$('query'),contentEl=$('content'),statusEl=$('status');
  const PERIOD_EN={'先秦與西漢':'Pre-Qin and Western Han','東漢':'Eastern Han','三國':'Three Kingdoms','兩晉':'Two Jin','南北朝':'Northern and Southern Dynasties','隋':'Sui','唐':'Tang','五代':'Five Dynasties','遼宋夏金':'Liao–Song–Xia–Jin','元':'Yuan','明':'Ming','清':'Qing'};
  const WORK_EN={'史記':'Records of the Grand Historian','漢書':'Book of Han','後漢書':'Book of Later Han','三國志':'Records of the Three Kingdoms','晉書':'Book of Jin','宋書':'Book of Song','南齊書':'Book of Southern Qi','梁書':'Book of Liang','陳書':'Book of Chen','魏書':'Book of Wei','北齊書':'Book of Northern Qi','周書':'Book of Zhou','南史':'History of the Southern Dynasties','北史':'History of the Northern Dynasties','隋書':'Book of Sui','舊唐書':'Old Book of Tang','新唐書':'New Book of Tang','舊五代史':'Old History of the Five Dynasties','新五代史':'New History of the Five Dynasties','遼史':'History of Liao','宋史':'History of Song','金史':'History of Jin','元史':'History of Yuan','明史':'History of Ming','清史稿':'Draft History of Qing'};
  const I18N={
    en:{title:'Historical Descriptor Explorer',lead:'Inspect one source-language descriptor across every recorded occurrence: its people, historical coverage, score distribution, contextual meanings, and sentence-level evidence.',back:'← Back to person search',placeholder:'Enter an exact source descriptor, e.g. 大度, 好學, 愚',search:'Open descriptor',loading:'Loading descriptor data…',prompt:'Enter an exact descriptor to inspect it across the corpus.',notFound:'No occurrence of this exact descriptor was found.',loadError:'The descriptor service is temporarily unavailable.',occurrences:'Occurrences',people:'People',works:'Historical works',sourceUnits:'Source units',sentences:'Located sentences',meanScore:'Mean score',medianRange:'Median · range',scoreDistribution:'Score distribution',periodCoverage:'Period coverage',workCoverage:'Historical-work coverage',meaningVariants:'Contextual meaning variants',personDistribution:'Most frequent people',allContexts:'All occurrence contexts',shown:'Showing {n} of {total} occurrences',filterText:'Filter text',filterPlaceholder:'person, meaning, or source text',minimumScore:'Minimum score',allScores:'All scores',period:'Period',allPeriods:'All periods',work:'Work',allWorks:'All works',sort:'Sort',sourceOrder:'Source order',scoreOrder:'Score high to low',personOrder:'Person',contextualMeaning:'Contextual meaning:',sentence:'sentence',candidate:'Candidate location {n}',ambiguous:'The exact repeated occurrence has not yet been disambiguated; all candidate contexts are shown.',crossSentence:'This descriptor spans more than one sentence.',openPerson:'Open person search',truncated:'The API result was truncated; not every occurrence is displayed.',sourceNote:'Statistics are calculated over exact source-form matches. Contextual meanings are model-generated modern Chinese glosses and should be checked against the highlighted source sentence.'},
    zh:{title:'历史 descriptor 总览',lead:'围绕一个原文 descriptor 汇总全部出现记录，包括人物覆盖、史书与时期分布、分数分布、语境释义以及句子级原文证据。',back:'← 返回人物检索',placeholder:'输入完全一致的原文 descriptor，例如：大度、好學、愚',search:'打开 descriptor',loading:'正在载入 descriptor 数据……',prompt:'请输入一个原文 descriptor，以查看它在整个语料库中的使用情况。',notFound:'没有找到完全一致的 descriptor。',loadError:'descriptor 检索服务暂时无法连接。',occurrences:'出现次数',people:'涉及人物',works:'覆盖史书',sourceUnits:'来源篇章',sentences:'已定位句子',meanScore:'平均分',medianRange:'中位数 · 范围',scoreDistribution:'分数分布',periodCoverage:'时期覆盖',workCoverage:'史书覆盖',meaningVariants:'语境释义变体',personDistribution:'高频人物',allContexts:'全部出现语境',shown:'显示 {n}／{total} 条记录',filterText:'筛选文本',filterPlaceholder:'人物、释义或原文',minimumScore:'最低分',allScores:'全部分数',period:'时期',allPeriods:'全部时期',work:'史书',allWorks:'全部史书',sort:'排序',sourceOrder:'按史料顺序',scoreOrder:'按分数从高到低',personOrder:'按人物',contextualMeaning:'语境释义：',sentence:'句',candidate:'候选位置 {n}',ambiguous:'相同文字的精确出现位置尚未消歧，以下显示全部候选语境。',crossSentence:'这项 descriptor 跨越一个以上的句子。',openPerson:'查看人物',truncated:'接口返回结果被截断，当前没有显示全部记录。',sourceNote:'统计仅合并原文形式完全一致的 descriptor。语境释义是模型生成的现代中文辅助解释，应结合高亮原句检查。'}
  };
  let lang='en',data=null;
  const t=(key,values={})=>Object.entries(values).reduce((text,[name,value])=>text.replaceAll(`{${name}}`,String(value)),I18N[lang][key]??key);
  const workLabel=value=>lang==='en'?`${WORK_EN[value]||value} (${value})`:value;
  const periodLabel=value=>lang==='en'?(PERIOD_EN[value]||value):value;
  const option=(value,label)=>`<option value="${esc(value)}">${esc(label)}</option>`;
  const number=value=>Number(value||0).toLocaleString(lang==='zh'?'zh-Hant':'en-US');
  function markedContext(text,start,end){const value=String(text??''),br=part=>esc(part).replaceAll('\n','<br>');if(!Number.isInteger(start)||!Number.isInteger(end)||start<0||end<=start||end>value.length)return br(value);return br(value.slice(0,start))+`<mark>${br(value.slice(start,end))}</mark>`+br(value.slice(end))}
  function contextBlock(value,label=''){return `${label?`<div class="candidate-label">${esc(label)}</div>`:''}<div class="source-text">${markedContext(value.context,value.start_in_context,value.end_in_context)}</div>`}
  function personUrl(value){const params=new URLSearchParams({q:value.person.name,mode:'exact'});if(lang==='zh')params.set('lang','zh');return `index.html#${params}`}
  function renderOccurrence(value){
    const where=[value.work?workLabel(value.work):'',value.section||value.page||'',value.sentence_ordinal?`${t('sentence')} ${value.sentence_ordinal}`:''].filter(Boolean).join(' · ');
    let body='';
    if(value.sentence_link_status==='ambiguous_across_sentences'||value.sentence_link_status==='resolved_same_sentence_repetition')body=`<div class="warning">${t('ambiguous')}</div>`+(value.candidates||[]).map((candidate,index)=>contextBlock(candidate,t('candidate',{n:index+1}))).join('');
    else{if(value.sentence_link_status==='cross_sentence')body+=`<div class="warning">${t('crossSentence')}</div>`;body+=contextBlock((value.candidates||[])[0]||value)}
    return `<article class="occurrence"><div class="occurrence-top"><div><a class="person-name" href="${personUrl(value)}">${esc(value.person.name)}</a><div class="meta">${esc(where)}<br>${esc(value.id)} · ${esc(value.person.id)} · ${esc(value.assertion_source)} · ${esc(value.assertion_status)} · ${esc(value.sentence_link_status)}</div></div><div class="score">${esc(value.score)}</div></div>${body}${value.meaning?`<div class="meaning"><b>${t('contextualMeaning')}</b> ${esc(value.meaning)}</div>`:''}</article>`;
  }
  function chips(values,limit=24,personLinks=false){
    const items=values.map(item=>personLinks?`<a class="tag" href="${personUrl({person:item})}">${esc(item.name)} ×${number(item.count)}</a>`:`<span class="tag">${esc(item.value)} ×${number(item.count)}</span>`);
    const visible=items.slice(0,limit).join(''),hidden=items.slice(limit).join('');
    return visible+(hidden?`<span class="more-items" hidden>${hidden}</span><button type="button" class="more-button" data-expand>${lang==='zh'?`展开其余 ${items.length-limit} 项`:`Show ${items.length-limit} more`}</button>`:'');
  }
  function scoreBands(){const max=Math.max(1,...data.score_bands.map(item=>item.count));return data.score_bands.map(item=>`<div class="band"><span>${esc(item.value)}</span><div class="bar-track"><div class="bar" style="width:${item.count/max*100}%"></div></div><b>${number(item.count)}</b></div>`).join('')}
  function renderOverview(){
    const s=data.statistics;
    $('page-title').innerHTML=`${esc(t('title'))}: <span class="descriptor-title">${esc(data.descriptor)}</span>`;
    contentEl.innerHTML=`${data.truncated?`<div class="warning">${t('truncated')}</div>`:''}<div class="metrics"><div class="metric"><strong>${number(data.total)}</strong><span>${t('occurrences')}</span></div><div class="metric"><strong>${number(s.people)}</strong><span>${t('people')}</span></div><div class="metric"><strong>${number(s.works)}</strong><span>${t('works')}</span></div><div class="metric"><strong>${number(s.source_units)}</strong><span>${t('sourceUnits')}</span></div><div class="metric"><strong>${number(s.sentences)}</strong><span>${t('sentences')}</span></div><div class="metric"><strong>${s.score_mean??'—'}</strong><span>${t('meanScore')}</span></div></div><div class="grid"><section class="panel"><h2>${t('scoreDistribution')}</h2>${scoreBands()}<div class="meta">${t('medianRange')}: ${s.score_median??'—'} · ${s.score_min??'—'}–${s.score_max??'—'}</div></section><section class="panel"><h2>${t('periodCoverage')}</h2><div class="tags">${chips(data.periods)}</div><h2 style="margin-top:16px">${t('workCoverage')}</h2><div class="tags">${chips(data.works)}</div></section><section class="panel"><h2>${t('meaningVariants')} (${number(data.meanings.length)})</h2><div class="tags">${chips(data.meanings,30)}</div></section><section class="panel"><h2>${t('personDistribution')} (${number(data.people.length)})</h2><div class="tags">${chips(data.people,30,true)}</div></section></div><section class="panel"><div class="context-head"><div><h2>${t('allContexts')}</h2><div id="context-count" class="context-count"></div></div><div class="filters"><label>${t('filterText')} <input id="text-filter" type="search" placeholder="${esc(t('filterPlaceholder'))}"></label><label>${t('minimumScore')} <select id="score-filter">${option('',t('allScores'))}${option('40','40')}${option('70','70')}${option('90','90')}</select></label><label>${t('period')} <select id="period-filter">${option('',t('allPeriods'))+data.periods.map(item=>option(item.value,periodLabel(item.value))).join('')}</select></label><label>${t('work')} <select id="work-filter">${option('',t('allWorks'))+data.works.map(item=>option(item.value,workLabel(item.value))).join('')}</select></label><label>${t('sort')} <select id="sort-filter">${option('source',t('sourceOrder'))}${option('score',t('scoreOrder'))}${option('person',t('personOrder'))}</select></label></div></div><div id="contexts"></div></section>`;
    ['text-filter','score-filter','period-filter','work-filter','sort-filter'].forEach(id=>$(id).addEventListener('input',renderContexts));
    renderContexts();
  }
  function renderContexts(){
    const needle=$('text-filter').value.trim().toLocaleLowerCase('zh-Hant'),minScore=Number($('score-filter').value||0),period=$('period-filter').value,work=$('work-filter').value,sort=$('sort-filter').value;
    let values=data.occurrences.filter(value=>(!minScore||Number(value.score)>=minScore)&&(!period||value.period===period)&&(!work||value.work===work)&&(!needle||[value.person.name,value.meaning,value.context].some(part=>String(part||'').toLocaleLowerCase('zh-Hant').includes(needle))));
    values=[...values].sort((a,b)=>sort==='score'?Number(b.score)-Number(a.score)||String(a.id).localeCompare(String(b.id)):sort==='person'?String(a.person.name).localeCompare(String(b.person.name),'zh-Hant')||String(a.id).localeCompare(String(b.id)):String(a.period).localeCompare(String(b.period),'zh-Hant')||String(a.work).localeCompare(String(b.work),'zh-Hant')||Number(a.volume||0)-Number(b.volume||0)||Number(a.sentence_ordinal||0)-Number(b.sentence_ordinal||0)||String(a.id).localeCompare(String(b.id)));
    $('context-count').textContent=t('shown',{n:number(values.length),total:number(data.total)});
    $('contexts').innerHTML=values.length?values.map(renderOccurrence).join(''):`<div class="empty">${t('notFound')}</div>`;
  }
  function updateHash(value){const params=new URLSearchParams();if(value)params.set('descriptor',value);if(lang==='zh')params.set('lang','zh');try{history.replaceState(null,'','#'+params)}catch(_error){}}
  async function loadDescriptor(){
    const descriptor=queryEl.value.trim();updateHash(descriptor);
    if(!descriptor){data=null;statusEl.textContent=t('prompt');contentEl.innerHTML=`<div class="empty">${t('prompt')}</div>`;return}
    statusEl.textContent=t('loading');contentEl.innerHTML='';
    try{const response=await fetch(`${API_BASE}/api/descriptor?${new URLSearchParams({descriptor,limit:'5000'})}`,{headers:{Accept:'application/json'}});if(!response.ok)throw new Error(`HTTP ${response.status}`);data=await response.json();if(!data.total){statusEl.textContent=t('notFound');contentEl.innerHTML=`<div class="empty">${t('notFound')}</div>`;return}statusEl.textContent=`${data.descriptor} · ${number(data.total)} ${t('occurrences')}`;renderOverview()}catch(_error){data=null;statusEl.textContent=t('loadError');contentEl.innerHTML=`<div class="empty">${t('loadError')}</div>`}
  }
  function setLanguage(next,{reload=false}={}){lang=next==='zh'?'zh':'en';document.documentElement.lang=lang==='zh'?'zh-Hant':'en';document.title=t('title');$('page-title').textContent=t('title');$('page-lead').textContent=t('lead');$('back-link').textContent=t('back');queryEl.placeholder=t('placeholder');$('search').textContent=t('search');$('source-note').textContent=t('sourceNote');$('lang-en').setAttribute('aria-pressed',String(lang==='en'));$('lang-zh').setAttribute('aria-pressed',String(lang==='zh'));try{localStorage.setItem('personSearchLanguage',lang)}catch(_error){}updateHash(queryEl.value.trim());if(data)renderOverview();else if(!queryEl.value.trim()){statusEl.textContent=t('prompt');contentEl.innerHTML=`<div class="empty">${t('prompt')}</div>`}if(reload&&queryEl.value.trim()&&!data)loadDescriptor()}
  $('search').addEventListener('click',loadDescriptor);queryEl.addEventListener('keydown',event=>{if(event.key==='Enter')loadDescriptor()});document.querySelectorAll('[data-lang]').forEach(button=>button.addEventListener('click',()=>setLanguage(button.dataset.lang)));
  contentEl.addEventListener('click',event=>{const button=event.target.closest('[data-expand]');if(!button)return;const more=button.previousElementSibling,expand=more.hidden;more.hidden=!expand;button.textContent=expand?(lang==='zh'?'收起':'Show fewer'):(lang==='zh'?`展开其余 ${more.children.length} 项`:`Show ${more.children.length} more`)});
  const initial=new URLSearchParams(location.hash.slice(1));queryEl.value=initial.get('descriptor')||'';let saved='en';try{saved=initial.get('lang')||localStorage.getItem('personSearchLanguage')||'en'}catch(_error){saved=initial.get('lang')||'en'}setLanguage(saved);loadDescriptor();
})();
</script>
</body>
</html>
